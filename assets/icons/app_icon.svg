<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Path Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Rounded Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="224" y1="96" x2="224" y2="416" />
    <line x1="288" y1="96" x2="288" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />

    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="224" x2="416" y2="224" />
    <line x1="96" y1="288" x2="416" y2="288" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="96" y1="416" x2="416" y2="416" />
  </g>

  <!-- Outer Maze Boundaries / Circuit Walls -->
  <g stroke="#1e293b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Perimeter Sections -->
    <path d="M 128 96 L 416 96 L 416 384" />
    <path d="M 96 128 L 96 416 L 384 416" />

    <!-- Interior Obstacle Walls -->
    <path d="M 160 160 L 256 160 L 256 224" />
    <path d="M 320 160 L 352 160 L 352 288" />
    <path d="M 160 224 L 160 352 L 224 352" />
    <path d="M 224 288 L 288 288 L 288 352" />
    <path d="M 352 352 L 288 352" />
  </g>

  <!-- Visited Exploration Field (Wavefront Ambient Glow) -->
  <g opacity="0.25">
    <circle cx="160" cy="160" r="18" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="224" cy="160" r="16" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="288" cy="160" r="14" fill="#60a5fa" filter="url(#softGlow)" />
    <circle cx="224" cy="224" r="18" fill="#818cf8" filter="url(#softGlow)" />
    <circle cx="352" cy="224" r="15" fill="#a78bfa" filter="url(#softGlow)" />
    <circle cx="160" cy="288" r="16" fill="#c084fc" filter="url(#softGlow)" />
    <circle cx="224" cy="352" r="18" fill="#f43f5e" filter="url(#softGlow)" />
  </g>

  <!-- Neon Glowing Solution Path -->
  <!-- Outer Glow Stroke -->
  <path d="M 96 96 
           H 224 
           V 224 
           H 288 
           V 224 
           H 352 
           V 288 
           H 224 
           V 416 
           H 416"
        fill="none"
        stroke="url(#pathGrad)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.4"
        filter="url(#neonGlow)" />

  <!-- Core Sharp Solution Line -->
  <path d="M 96 96 
           H 224 
           V 224 
           H 288 
           V 224 
           H 352 
           V 288 
           H 224 
           V 416 
           H 416"
        fill="none"
        stroke="url(#pathGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Inner Bright Energy Filament -->
  <path d="M 96 96 
           H 224 
           V 224 
           H 288 
           V 224 
           H 352 
           V 288 
           H 224 
           V 416 
           H 416"
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85" />

  <!-- Start Node (Emerald Star) -->
  <g transform="translate(96, 96)">
    <!-- Pulse Rings -->
    <circle cx="0" cy="0" r="32" fill="#10b981" opacity="0.2" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="22" fill="#047857" stroke="#34d399" stroke-width="4" />
    <circle cx="0" cy="0" r="10" fill="#a7f3d0" />
    <text x="0" y="4" font-family="'Consolas', monospace" font-size="14" font-weight="900" fill="#064e3b" text-anchor="middle" dominant-baseline="central">S</text>
  </g>

  <!-- Goal Node (Ruby Beacon with Star Particles) -->
  <g transform="translate(416, 416)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="36" fill="#f43f5e" opacity="0.3" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="24" fill="#be123c" stroke="#fb7185" stroke-width="4" />
    <circle cx="0" cy="0" r="11" fill="#fecdd3" />
    <text x="0" y="4" font-family="'Consolas', monospace" font-size="14" font-weight="900" fill="#881337" text-anchor="middle" dominant-baseline="central">G</text>

    <!-- Celebration Spark Particles -->
    <circle cx="-28" cy="-18" r="4" fill="#fbbf24" opacity="0.9" />
    <circle cx="26" cy="-24" r="5" fill="#f43f5e" opacity="0.9" />
    <circle cx="-16" cy="30" r="3" fill="#38bdf8" opacity="0.9" />
    <circle cx="24" cy="22" r="4.5" fill="#34d399" opacity="0.9" />
  </g>
</svg>
